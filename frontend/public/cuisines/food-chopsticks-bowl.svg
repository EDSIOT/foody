<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Bowl shadow -->
  <ellipse cx="100" cy="165" rx="60" ry="10" fill="#1e293b" opacity="0.08"/>
  <!-- Bowl body -->
  <path d="M30 100 Q30 165 100 165 Q170 165 170 100 Z" fill="#3b82f6"/>
  <path d="M33 102 Q33 162 100 162 Q167 162 167 102 Z" fill="#1e293b" opacity="0.1"/>
  <!-- Bowl rim -->
  <ellipse cx="100" cy="100" rx="72" ry="14" fill="#3b82f6"/>
  <ellipse cx="100" cy="99" rx="68" ry="11" fill="white" opacity="0.15"/>
  <!-- Rice inside -->
  <ellipse cx="100" cy="98" rx="62" ry="10" fill="white" opacity="0.9"/>
  <!-- Rice grain texture -->
  <ellipse cx="80" cy="96" rx="4" ry="2" fill="#e2e8f0" transform="rotate(20 80 96)"/>
  <ellipse cx="95" cy="94" rx="4" ry="2" fill="#e2e8f0" transform="rotate(-10 95 94)"/>
  <ellipse cx="110" cy="97" rx="4" ry="2" fill="#e2e8f0" transform="rotate(15 110 97)"/>
  <ellipse cx="120" cy="95" rx="3.5" ry="1.8" fill="#e2e8f0" transform="rotate(-20 120 95)"/>
  <ellipse cx="70" cy="98" rx="3.5" ry="1.8" fill="#e2e8f0" transform="rotate(5 70 98)"/>
  <!-- Bowl pattern -->
  <path d="M42 120 Q100 135 158 120" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.12"/>
  <path d="M48 135 Q100 148 152 135" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.12"/>
  <!-- Chopstick 1 -->
  <line x1="60" y1="30" x2="125" y2="95" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
  <line x1="61" y1="31" x2="120" y2="90" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Chopstick 2 -->
  <line x1="75" y1="28" x2="135" y2="92" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
  <line x1="76" y1="29" x2="130" y2="87" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Bowl highlight -->
  <rect x="38" y="108" width="8" height="40" rx="4" fill="white" opacity="0.1"/>
</svg>