name: Pipeline quotidien Foody
env: 
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Tous les jours à 6h UTC (7h ou 8h heure française selon l'heure d'été/hiver)
    - cron: '0 6 * * *'
  workflow_dispatch:  # permet de le lancer manuellement depuis GitHub aussi


jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # sécurité, au cas où pytrends bloque en boucle

    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Installer les dépendances
        run: uv sync

      - name: Lancer le pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python run_pipeline.py

      - name: Uploader les logs en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pipeline-logs
          path: logs/
